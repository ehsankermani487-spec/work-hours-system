<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>درخواست‌ها</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            font-family: Tahoma, Arial, sans-serif;
            cursor: pointer;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            color: white;
        }

        .back {
            background: #475569;
        }

        .logout {
            background: #dc2626;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
            margin-bottom: 25px;
        }

        .box h2 {
            margin-top: 0;
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-family: Tahoma, Arial, sans-serif;
            font-size: 14px;

            background: white;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .hidden {
            display: none !important;
        }

        .submit {
            margin-top: 20px;
            width: 100%;

            background: #2563eb;
            color: white;

            border: none;
            padding: 13px;

            border-radius: 8px;
            font-size: 15px;
        }

        .submit:hover {
            background: #1d4ed8;
        }

        #message,
        #adminMessage {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .badge-approved {
            background: #dcfce7;
            color: #166534;
        }

        .badge-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .small-btn {
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            margin: 2px;
        }

        .approve {
            background: #16a34a;
        }

        .reject {
            background: #dc2626;
        }

        .cancel {
            background: #64748b;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        @media(max-width:650px) {

            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <h1>
        📝 درخواست‌ها
    </h1>


    <div class="buttons">

        <button
            class="btn back"
            onclick="location.href='index.html'"
        >
            ← داشبورد
        </button>


        <button
            class="btn logout"
            onclick="logout()"
        >
            🚪 خروج
        </button>

    </div>

</header>



<div class="container">


    <!-- فرم ثبت درخواست جدید (برای همه کاربران) -->

    <div class="box" id="newRequestBox">

        <h2>
            ثبت درخواست جدید
        </h2>


        <form id="requestForm">

            <div class="form-grid">

                <div class="full">

                    <label>
                        نوع درخواست
                    </label>

                    <select id="requestType" required>
                        <option value="">انتخاب کنید</option>
                        <option value="advance">مساعده</option>
                        <option value="leave">مرخصی</option>
                        <option value="other">سایر</option>
                    </select>

                </div>


                <div class="full field-amount hidden">

                    <label>
                        مبلغ مساعده (تومان)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        min="0"
                        placeholder="مثلاً 2000000"
                    >

                </div>


                <div class="field-leave hidden">

                    <label>
                        از تاریخ
                    </label>

                    <input
                        type="text"
                        id="startDate"
                        placeholder="1405-05-06"
                        pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}"
                    >

                </div>


                <div class="field-leave hidden">

                    <label>
                        تا تاریخ
                    </label>

                    <input
                        type="text"
                        id="endDate"
                        placeholder="1405-05-10"
                        pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}"
                    >

                </div>


                <div class="full">

                    <label>
                        توضیحات
                    </label>

                    <textarea
                        id="description"
                        placeholder="توضیحات یا دلیل درخواست (اختیاری)"
                    ></textarea>

                </div>

            </div>


            <button type="submit" class="submit">
                ✅ ثبت درخواست
            </button>

            <p id="message"></p>

        </form>

    </div>



    <!-- درخواست‌های من -->

    <div class="box" id="myRequestsBox">

        <h2>
            درخواست‌های من
        </h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>نوع</th>
                        <th>جزئیات</th>
                        <th>توضیحات</th>
                        <th>وضعیت</th>
                        <th>تاریخ ثبت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>

                <tbody id="myRequestsTable">
                    <tr>
                        <td colspan="6" class="empty">
                            در حال بارگذاری...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>



    <!-- بررسی درخواست‌ها (فقط ادمین) -->

    <div class="box hidden" id="adminBox">

        <h2>
            بررسی درخواست‌های کارکنان
        </h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>نام کارمند</th>
                        <th>نوع</th>
                        <th>جزئیات</th>
                        <th>توضیحات</th>
                        <th>وضعیت</th>
                        <th>تاریخ ثبت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>

                <tbody id="adminRequestsTable">
                    <tr>
                        <td colspan="7" class="empty">
                            در حال بارگذاری...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

        <p id="adminMessage"></p>

    </div>


</div>



<script>

const typeLabels = {
    advance: "مساعده",
    leave: "مرخصی",
    other: "سایر"
};

const statusLabels = {
    pending: { text: "در انتظار بررسی", cls: "badge-pending" },
    approved: { text: "تایید شده", cls: "badge-approved" },
    rejected: { text: "رد شده", cls: "badge-rejected" }
};


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function formatDetails(request) {

    if (request.request_type === "advance") {

        return `${Number(request.amount || 0).toLocaleString("fa-IR")} تومان`;
    }

    if (request.request_type === "leave") {

        return `${request.start_date} تا ${request.end_date}`;
    }

    return "-";
}


function renderStatusBadge(status) {

    const info = statusLabels[status] || statusLabels.pending;

    return `<span class="badge ${info.cls}">${info.text}</span>`;
}


// =====================================================
// نمایش/مخفی کردن فیلدهای فرم بر اساس نوع درخواست
// =====================================================

document
    .getElementById("requestType")
    .addEventListener("change", function () {

        const type = this.value;

        document
            .querySelectorAll(".field-amount")
            .forEach(el => el.classList.toggle("hidden", type !== "advance"));

        document
            .querySelectorAll(".field-leave")
            .forEach(el => el.classList.toggle("hidden", type !== "leave"));

    });


// =====================================================
// ثبت درخواست جدید
// =====================================================

document
    .getElementById("requestForm")
    .addEventListener("submit", async function (event) {

        event.preventDefault();

        const requestType =
            document.getElementById("requestType").value;

        const amount =
            document.getElementById("amount").value;

        const startDate =
            document.getElementById("startDate").value.trim();

        const endDate =
            document.getElementById("endDate").value.trim();

        const description =
            document.getElementById("description").value.trim();

        const message =
            document.getElementById("message");

        if (!requestType) {

            message.textContent = "لطفاً نوع درخواست را انتخاب کنید.";
            message.className = "error";
            return;
        }

        try {

            const response =
                await fetch("/api/requests", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        requestType,
                        amount: amount ? Number(amount) : null,
                        startDate,
                        endDate,
                        description
                    })
                });

            if (response.status === 401) {
                location.href = "/login.html";
                return;
            }

            const result = await response.json();

            message.textContent = result.message || "ثبت شد.";
            message.className = response.ok ? "success" : "error";

            if (response.ok) {

                document.getElementById("requestForm").reset();

                document
                    .querySelectorAll(".field-amount, .field-leave")
                    .forEach(el => el.classList.add("hidden"));

                loadMyRequests();

                if (!document.getElementById("adminBox").classList.contains("hidden")) {
                    loadAdminRequests();
                }
            }

        } catch (error) {

            console.error(error);
            message.textContent = "خطا در ارتباط با سرور.";
            message.className = "error";
        }

    });


// =====================================================
// نمایش درخواست‌های خودم
// =====================================================

async function loadMyRequests() {

    const table = document.getElementById("myRequestsTable");

    try {

        const response = await fetch("/api/requests", { credentials: "same-origin" });

        if (response.status === 401) {
            location.href = "/login.html";
            return;
        }

        const requests = await response.json();

        table.innerHTML = "";

        if (!Array.isArray(requests) || requests.length === 0) {

            table.innerHTML = `
                <tr><td colspan="6" class="empty">هنوز درخواستی ثبت نکرده‌اید.</td></tr>
            `;
            return;
        }

        requests.forEach(request => {

            table.innerHTML += `
                <tr>
                    <td>${typeLabels[request.request_type] || request.request_type}</td>
                    <td>${formatDetails(request)}</td>
                    <td>${escapeHtml(request.description) || "-"}</td>
                    <td>${renderStatusBadge(request.status)}</td>
                    <td>${(request.created_at || "").split(" ")[0]}</td>
                    <td>
                        ${
                            request.status === "pending"
                                ? `<button class="small-btn cancel" onclick="cancelRequest(${request.id})">لغو</button>`
                                : "-"
                        }
                    </td>
                </tr>
            `;

        });

    } catch (error) {

        console.error(error);
        table.innerHTML = `<tr><td colspan="6" class="empty">خطا در دریافت درخواست‌ها.</td></tr>`;
    }
}


async function cancelRequest(id) {

    if (!confirm("درخواست لغو شود؟")) return;

    try {

        const response = await fetch(`/api/requests/${id}`, {
            method: "DELETE",
            credentials: "same-origin"
        });

        const result = await response.json();

        alert(result.message || "انجام شد.");
        loadMyRequests();

    } catch (error) {
        console.error(error);
        alert("خطا در ارتباط با سرور.");
    }
}


// =====================================================
// بخش ادمین: مشاهده و بررسی همه‌ی درخواست‌ها
// =====================================================

async function loadAdminRequests() {

    const table = document.getElementById("adminRequestsTable");

    try {

        const response = await fetch("/api/requests", { credentials: "same-origin" });
        const requests = await response.json();

        table.innerHTML = "";

        if (!Array.isArray(requests) || requests.length === 0) {

            table.innerHTML = `<tr><td colspan="7" class="empty">درخواستی ثبت نشده است.</td></tr>`;
            return;
        }

        requests.forEach(request => {

            table.innerHTML += `
                <tr>
                    <td>${escapeHtml(request.employee_name)}</td>
                    <td>${typeLabels[request.request_type] || request.request_type}</td>
                    <td>${formatDetails(request)}</td>
                    <td>${escapeHtml(request.description) || "-"}</td>
                    <td>${renderStatusBadge(request.status)}</td>
                    <td>${(request.created_at || "").split(" ")[0]}</td>
                    <td>
                        ${
                            request.status === "pending"
                                ? `
                                    <button class="small-btn approve" onclick="reviewRequest(${request.id}, 'approved')">تایید</button>
                                    <button class="small-btn reject" onclick="reviewRequest(${request.id}, 'rejected')">رد</button>
                                `
                                : "-"
                        }
                    </td>
                </tr>
            `;

        });

    } catch (error) {

        console.error(error);
        table.innerHTML = `<tr><td colspan="7" class="empty">خطا در دریافت درخواست‌ها.</td></tr>`;
    }
}


async function reviewRequest(id, status) {

    try {

        const response = await fetch(`/api/requests/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ status })
        });

        const result = await response.json();

        document.getElementById("adminMessage").textContent = result.message || "انجام شد.";

        loadAdminRequests();
        loadMyRequests();

    } catch (error) {
        console.error(error);
        alert("خطا در ارتباط با سرور.");
    }
}


// =====================================================
// خروج
// =====================================================

async function logout() {

    try {
        await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
    } catch (error) {
        console.error(error);
    }

    location.href = "/login.html";
}


// =====================================================
// شروع صفحه: تشخیص نقش کاربر
// =====================================================

async function init() {

    try {

        const response = await fetch("/api/me", { credentials: "same-origin" });

        if (response.status === 401) {
            location.href = "/login.html";
            return;
        }

        const me = await response.json();

        if (me.role === "admin") {

            document.getElementById("adminBox").classList.remove("hidden");
            document.getElementById("newRequestBox").classList.add("hidden");
            document.getElementById("myRequestsBox").classList.add("hidden");
            loadAdminRequests();
            return;
        }

    } catch (error) {
        console.error(error);
    }

    loadMyRequests();
}

init();

</script>


</body>

</html>
