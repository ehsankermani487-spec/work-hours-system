<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>کسورات</title>

<style>

body {
    margin:0;
    font-family:Tahoma,Arial;
    background:#f1f5f9;
}

header {
    background:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
}

.container {
    max-width:1000px;
    margin:30px auto;
    padding:15px;
}

.box {
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
}

input,select {
    padding:11px;
    margin:5px;
    border:1px solid #cbd5e1;
    border-radius:8px;
}

button {
    padding:10px 17px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-family:Tahoma;
}

.add {
    background:#2563eb;
    color:white;
}

.logout {
    background:#dc2626;
    color:white;
}

table {
    width:100%;
    border-collapse:collapse;
}

th,td {
    border:1px solid #ddd;
    padding:11px;
    text-align:center;
}

th {
    background:#f8fafc;
}

</style>

</head>

<body>

<header>

<h2>➖ کسورات</h2>

<div>

<button onclick="location.href='index.html'">
← داشبورد
</button>

<button
    class="logout"
    onclick="logout()"
>
خروج
</button>

</div>

</header>


<div class="container">


<div class="box">

<h2>ثبت کسری</h2>

<select id="employee">

<option value="">
انتخاب کارمند
</option>

</select>

<input
    id="date"
    placeholder="1405-05-06"
>

<input
    id="type"
    placeholder="نوع کسری"
>

<input
    id="amount"
    type="number"
    placeholder="مبلغ"
>

<input
    id="description"
    placeholder="توضیحات"
>

<button
    class="add"
    onclick="addDeduction()"
>
ثبت کسری
</button>

</div>


<div class="box">

<h2>لیست کسورات</h2>

<table>

<thead>

<tr>
<th>کارمند</th>
<th>تاریخ</th>
<th>نوع</th>
<th>مبلغ</th>
<th>توضیحات</th>
</tr>

</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>


<script>

async function load() {

    const employeesResponse =
        await fetch("/api/employees");


    if(!employeesResponse.ok) {

        location.href="index.html";
        return;

    }


    const employees =
        await employeesResponse.json();


    const select =
        document.getElementById(
            "employee"
        );


    employees.forEach(e => {

        select.innerHTML += `

            <option value="${escapeHtml(e.name)}">
                ${escapeHtml(e.name)}
            </option>

        `;

    });


    loadDeductions();

}


async function loadDeductions() {

    const response =
        await fetch("/api/deductions");


    const records =
        await response.json();


    const table =
        document.getElementById("table");


    table.innerHTML = "";


    records.forEach(r => {

        table.innerHTML += `

            <tr>

                <td>
                    ${escapeHtml(r.employee_name)}
                </td>

                <td>
                    ${r.deduction_date}
                </td>

                <td>
                    ${escapeHtml(r.deduction_type)}
                </td>

                <td>
                    ${Number(r.amount).toLocaleString()}
                </td>

                <td>
                    ${escapeHtml(r.description || "")}
                </td>

            </tr>

        `;

    });

}


async function addDeduction() {

    const employee =
        document.getElementById(
            "employee"
        ).value;

    const date =
        document.getElementById(
            "date"
        ).value;

    const type =
        document.getElementById(
            "type"
        ).value;

    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );

    const description =
        document.getElementById(
            "description"
        ).value;


    const response =
        await fetch(
            "/api/deductions",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    employee_name:
                        employee,

                    deduction_date:
                        date,

                    deduction_type:
                        type,

                    amount,

                    description

                })

            }
        );


    const result =
        await response.json();


    alert(result.message);


    if(response.ok) {

        loadDeductions();

    }

}


function escapeHtml(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


async function logout() {

    await fetch(
        "/api/logout",
        {method:"POST"}
    );

    location.href="/login.html";

}


load();

</script>

</body>

</html>
