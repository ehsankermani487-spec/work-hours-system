<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تنظیمات پروفایل</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            font-family: Tahoma, Arial, sans-serif;
            cursor: pointer;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            color: white;
        }

        .back {
            background: #475569;
        }

        .logout {
            background: #dc2626;
        }

        .container {
            max-width: 600px;
            margin: 35px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
            margin-bottom: 25px;
        }

        .box h2 {
            margin-top: 0;
            margin-bottom: 22px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: #64748b;
        }

        .info-row .value {
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-family: Tahoma, Arial, sans-serif;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .submit {
            width: 100%;

            background: #2563eb;
            color: white;

            border: none;
            padding: 13px;

            border-radius: 8px;
            font-size: 15px;
        }

        .submit:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        @media(max-width:650px) {

            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <h1>
        👤 تنظیمات پروفایل
    </h1>


    <div class="buttons">

        <button
            class="btn back"
            onclick="location.href='index.html'"
        >
            ← داشبورد
        </button>


        <button
            class="btn logout"
            onclick="logout()"
        >
            🚪 خروج
        </button>

    </div>

</header>



<div class="container">


    <!-- عکس پروفایل -->

    <div class="box" style="text-align:center;">

        <h2>
            عکس پروفایل
        </h2>

        <img
            id="profilePhoto"
            src=""
            style="width:110px;height:110px;border-radius:50%;object-fit:cover;background:#e2e8f0;display:none;margin-bottom:15px;"
        >

        <div
            id="profilePhotoPlaceholder"
            style="width:110px;height:110px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 15px;"
        >
            👤
        </div>

        <div>
            <input type="file" id="photoInput" accept="image/*" style="margin-bottom:12px;">
        </div>

        <button
            type="button"
            class="submit"
            style="width:auto;padding:10px 25px;"
            onclick="uploadPhoto()"
        >
            📤 آپلود عکس
        </button>

        <p id="photoMessage"></p>

    </div>



    <!-- اطلاعات حساب -->

    <div class="box">

        <h2>
            اطلاعات حساب
        </h2>

        <div id="accountInfo">

            <div class="info-row">
                <span class="label">در حال بارگذاری...</span>
            </div>

        </div>

    </div>



    <!-- تغییر رمز عبور -->

    <div class="box">

        <h2>
            تغییر رمز عبور
        </h2>

        <form id="passwordForm">

            <label>
                رمز عبور فعلی
            </label>

            <input
                type="password"
                id="currentPassword"
                required
            >


            <label>
                رمز عبور جدید
            </label>

            <input
                type="password"
                id="newPassword"
                required
            >


            <label>
                تکرار رمز عبور جدید
            </label>

            <input
                type="password"
                id="confirmPassword"
                required
            >


            <button type="submit" class="submit">
                💾 تغییر رمز عبور
            </button>

            <p id="message"></p>

        </form>

    </div>


</div>



<script>

// =====================================================
// نمایش عکس پروفایل فعلی
// =====================================================

function showPhoto(photoUrl) {

    const img = document.getElementById("profilePhoto");
    const placeholder = document.getElementById("profilePhotoPlaceholder");

    if (photoUrl) {
        img.src = photoUrl;
        img.style.display = "inline-block";
        placeholder.style.display = "none";
    } else {
        img.style.display = "none";
        placeholder.style.display = "flex";
    }
}


// =====================================================
// آپلود عکس پروفایل
// =====================================================

function uploadPhoto() {

    const input = document.getElementById("photoInput");
    const message = document.getElementById("photoMessage");

    if (!input.files || !input.files[0]) {
        message.textContent = "لطفاً یک فایل انتخاب کنید.";
        message.className = "error";
        return;
    }

    const file = input.files[0];

    if (file.size > 3 * 1024 * 1024) {
        message.textContent = "حجم عکس باید کمتر از ۳ مگابایت باشد.";
        message.className = "error";
        return;
    }

    const reader = new FileReader();

    reader.onload = async function () {

        try {

            const response = await fetch("/api/me/photo", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({ photo: reader.result })
            });

            if (response.status === 401) {
                location.href = "/login.html";
                return;
            }

            const result = await response.json();

            message.textContent = result.message || "انجام شد.";
            message.className = response.ok ? "success" : "error";

            if (response.ok) {
                showPhoto(reader.result);
            }

        } catch (error) {

            console.error(error);
            message.textContent = "خطا در ارتباط با سرور.";
            message.className = "error";
        }
    };

    reader.readAsDataURL(file);
}


// =====================================================
// نمایش اطلاعات حساب
// =====================================================

async function loadAccountInfo() {

    const box = document.getElementById("accountInfo");

    try {

        const response = await fetch("/api/me", { credentials: "same-origin" });

        if (response.status === 401) {
            location.href = "/login.html";
            return;
        }

        const me = await response.json();

        showPhoto(me.photo);

        let rows = `
            <div class="info-row">
                <span class="label">نام کاربری</span>
                <span class="value">${me.username}</span>
            </div>
            <div class="info-row">
                <span class="label">نقش</span>
                <span class="value">${me.role === "admin" ? "مدیر" : "کارمند"}</span>
            </div>
        `;

        if (me.employee) {

            rows += `
                <div class="info-row">
                    <span class="label">نام کارمند</span>
                    <span class="value">${me.employee.name}</span>
                </div>
            `;

            if (me.employee.personnel_number) {

                rows += `
                    <div class="info-row">
                        <span class="label">شماره پرسنلی</span>
                        <span class="value">${me.employee.personnel_number}</span>
                    </div>
                `;
            }
        }

        box.innerHTML = rows;

    } catch (error) {

        console.error(error);
        box.innerHTML = `<div class="info-row"><span class="label">خطا در دریافت اطلاعات حساب.</span></div>`;
    }
}


// =====================================================
// تغییر رمز عبور
// =====================================================

document
    .getElementById("passwordForm")
    .addEventListener("submit", async function (event) {

        event.preventDefault();

        const currentPassword = document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        const message = document.getElementById("message");

        if (newPassword !== confirmPassword) {

            message.textContent = "رمز جدید و تکرار آن یکسان نیستند.";
            message.className = "error";
            return;
        }

        try {

            const response = await fetch("/api/me/password", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({ currentPassword, newPassword })
            });

            if (response.status === 401) {
                location.href = "/login.html";
                return;
            }

            const result = await response.json();

            message.textContent = result.message || "انجام شد.";
            message.className = response.ok ? "success" : "error";

            if (response.ok) {
                document.getElementById("passwordForm").reset();
            }

        } catch (error) {

            console.error(error);
            message.textContent = "خطا در ارتباط با سرور.";
            message.className = "error";
        }

    });


// =====================================================
// خروج
// =====================================================

async function logout() {

    try {
        await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
    } catch (error) {
        console.error(error);
    }

    location.href = "/login.html";
}


loadAccountInfo();

</script>


</body>

</html>
