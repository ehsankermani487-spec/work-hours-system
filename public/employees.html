<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>مدیریت کارکنان</title>

<style>

body {
    margin:0;
    font-family:Tahoma,Arial;
    background:#f1f5f9;
}

header {
    background:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
}

.container {
    max-width:1100px;
    margin:30px auto;
    padding:15px;
}

.box {
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
}

input {
    padding:11px;
    margin:5px;
    border:1px solid #cbd5e1;
    border-radius:8px;
}

button {
    padding:9px 15px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-family:Tahoma;
}

.add {
    background:#2563eb;
    color:white;
}

.edit {
    background:#f59e0b;
}

.delete {
    background:#dc2626;
    color:white;
}

.account {
    background:#16a34a;
    color:white;
}

.logout {
    background:#dc2626;
    color:white;
}

table {
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td {
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th {
    background:#f8fafc;
}

</style>

</head>

<body>

<header>

<h2>👨‍💼 مدیریت کارکنان</h2>

<div>

<button onclick="location.href='index.html'">
← داشبورد
</button>

<button
    class="logout"
    onclick="logout()"
>
خروج
</button>

</div>

</header>


<div class="container">


<div class="box">

<h2>افزودن کارمند</h2>

<input
    id="name"
    placeholder="نام کارمند"
>

<input
    id="personnelNumber"
    placeholder="شماره پرسنلی"
>

<input
    id="hourlyRate"
    type="number"
    placeholder="حقوق ساعتی"
>

<input
    id="username"
    placeholder="نام کاربری"
>

<input
    id="password"
    type="password"
    placeholder="رمز عبور کارمند"
>

<button
    class="add"
    onclick="addEmployee()"
>
ثبت کارمند
</button>

<p>
اگر نام کاربری و رمز عبور وارد کنید،
حساب ورود کارمند نیز ساخته می‌شود.
</p>

</div>


<div class="box">

<h2>لیست کارکنان</h2>

<table>

<thead>

<tr>

<th>نام</th>
<th>شماره پرسنلی</th>
<th>حقوق ساعتی</th>
<th>عملیات</th>

</tr>

</thead>

<tbody id="table"></tbody>

</table>

</div>


</div>


<script>

async function loadEmployees() {

    const response =
        await fetch("/api/employees");


    if(response.status === 403) {

        alert("دسترسی غیرمجاز");
        location.href="index.html";
        return;

    }


    const employees =
        await response.json();


    const table =
        document.getElementById("table");


    table.innerHTML = "";


    employees.forEach(e => {

        table.innerHTML += `

            <tr>

                <td>
                    ${escapeHtml(e.name)}
                </td>

                <td>
                    ${escapeHtml(e.personnel_number || "-")}
                </td>

                <td>
                    ${Number(e.hourly_rate).toLocaleString()}
                </td>

                <td>

                    <button
                        class="edit"
                        onclick="editEmployee(
                            ${e.id},
                            '${escapeJs(e.name)}',
                            ${e.hourly_rate},
                            '${escapeJs(e.personnel_number || "")}'
                        )"
                    >
                        ✏️ ویرایش
                    </button>


                    <button
                        class="account"
                        onclick="createAccount(${e.id})"
                    >
                        🔐 ساخت حساب
                    </button>


                    <button
                        class="delete"
                        onclick="deleteEmployee(${e.id})"
                    >
                        🗑 حذف
                    </button>

                </td>

            </tr>

        `;

    });

}


async function addEmployee() {

    const name =
        document.getElementById("name").value.trim();

    const personnelNumber =
        document
            .getElementById("personnelNumber")
            .value.trim();

    const hourlyRate =
        Number(
            document
                .getElementById("hourlyRate")
                .value
        );

    const username =
        document
            .getElementById("username")
            .value.trim();

    const password =
        document
            .getElementById("password")
            .value;


    if(!name || !hourlyRate) {

        alert(
            "نام و حقوق ساعتی الزامی است."
        );

        return;

    }


    const response =
        await fetch(
            "/api/employees",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    name,
                    hourlyRate,
                    personnelNumber,

                    username:
                        username || undefined,

                    password:
                        password || undefined

                })

            }
        );


    const result =
        await response.json();


    alert(result.message);


    if(response.ok) {

        document
            .getElementById("name")
            .value = "";

        document
            .getElementById("personnelNumber")
            .value = "";

        document
            .getElementById("hourlyRate")
            .value = "";

        document
            .getElementById("username")
            .value = "";

        document
            .getElementById("password")
            .value = "";

        loadEmployees();

    }

}


async function createAccount(id) {

    const username =
        prompt("نام کاربری کارمند:");

    if(!username) return;


    const password =
        prompt("رمز عبور کارمند:");

    if(!password) return;


    const response =
        await fetch(
            `/api/employees/${id}/account`,
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    username,
                    password
                })

            }
        );


    const result =
        await response.json();


    alert(result.message);

}


async function editEmployee(
    id,
    name,
    rate,
    personnelNumber
) {

    const newName =
        prompt("نام جدید:",name);

    if(!newName) return;


    const newRate =
        prompt("حقوق ساعتی جدید:",rate);

    if(!newRate) return;


    const newPersonnel =
        prompt(
            "شماره پرسنلی:",
            personnelNumber
        );


    await fetch(
        `/api/employees/${id}`,
        {
            method:"PUT",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                name:newName,

                hourlyRate:
                    Number(newRate),

                overtimeRate:1.4,

                personnelNumber:
                    newPersonnel

            })

        }
    );


    loadEmployees();

}


async function deleteEmployee(id) {

    if(!confirm(
        "آیا از حذف کارمند مطمئن هستید؟"
    )) return;


    await fetch(
        `/api/employees/${id}`,
        {
            method:"DELETE"
        }
    );


    loadEmployees();

}


function escapeHtml(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


function escapeJs(text) {

    return String(text)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


async function logout() {

    await fetch(
        "/api/logout",
        {method:"POST"}
    );

    location.href="/login.html";

}


loadEmployees();

</script>

</body>

</html>
