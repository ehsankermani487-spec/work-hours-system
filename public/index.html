<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>داشبورد</title>

<style>

body {
    margin:0;
    font-family:Tahoma,Arial;
    background:#f1f5f9;
    color:#1e293b;
}

header {
    background:white;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

button {
    border:0;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
    font-family:Tahoma;
}

.logout {
    background:#dc2626;
    color:white;
}

.container {
    max-width:1100px;
    margin:40px auto;
    padding:15px;
}

.welcome {
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    margin-bottom:25px;
}

.cards {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card {
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.icon {
    font-size:40px;
}

.card p {
    color:#64748b;
}

@media(max-width:700px) {
    .cards {
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<header>

<h2>🏢 سیستم مدیریت کارکنان</h2>

<button
    class="logout"
    onclick="logout()"
>
🚪 خروج
</button>

</header>


<div class="container">

<div class="welcome">

<h2 id="welcome">
    در حال دریافت اطلاعات...
</h2>

<p id="roleText"></p>

</div>


<div
    class="cards"
    id="cards"
></div>

</div>


<script>

async function loadDashboard() {

    const response =
        await fetch("/api/me");


    if(!response.ok) {

        window.location.href="/login.html";
        return;

    }


    const user =
        await response.json();


    document
        .getElementById("welcome")
        .textContent =
        user.role === "admin"
        ? "👑 خوش آمدید مدیر"
        : `👤 خوش آمدید ${user.employee?.name || ""}`;


    const cards =
        document.getElementById("cards");


    if(user.role === "admin") {

        cards.innerHTML = `

            <div class="card"
                 onclick="location.href='employees.html'">
                <div class="icon">👨‍💼</div>
                <h3>مدیریت کارکنان</h3>
                <p>ثبت و مدیریت کارکنان و حساب‌ها</p>
            </div>

            <div class="card"
                 onclick="location.href='work-hours.html'">
                <div class="icon">🕐</div>
                <h3>ثبت ساعت کاری</h3>
                <p>ثبت ساعت کاری کارکنان</p>
            </div>

            <div class="card"
                 onclick="location.href='salary.html'">
                <div class="icon">💰</div>
                <h3>محاسبه حقوق</h3>
                <p>محاسبه حقوق ماهانه</p>
            </div>

            <div class="card"
                 onclick="location.href='deductions.html'">
                <div class="icon">➖</div>
                <h3>کسورات</h3>
                <p>ثبت کسورات کارکنان</p>
            </div>

            <div class="card"
                 onclick="location.href='salary.html'">
                <div class="icon">🧾</div>
                <h3>فیش حقوقی</h3>
                <p>مشاهده و چاپ فیش</p>
            </div>

            <div class="card"
                 onclick="location.href='company.html'">
                <div class="icon">⚙️</div>
                <h3>تنظیمات شرکت</h3>
                <p>اطلاعات شرکت و مدیر</p>
            </div>

        `;

    } else {

        cards.innerHTML = `

            <div class="card"
                 onclick="location.href='work-hours.html'">
                <div class="icon">🕐</div>
                <h3>ثبت ساعت کاری</h3>
                <p>ثبت ساعت کاری خودم</p>
            </div>

            <div class="card"
                 onclick="location.href='salary.html'">
                <div class="icon">💰</div>
                <h3>حقوق من</h3>
                <p>مشاهده حقوق ماهانه خودم</p>
            </div>

        `;

    }

}


async function logout() {

    await fetch(
        "/api/logout",
        {method:"POST"}
    );

    window.location.href =
        "/login.html";

}


loadDashboard();

</script>

</body>

</html>
