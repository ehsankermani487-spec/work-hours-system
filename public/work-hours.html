<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>ثبت ساعت کاری</title>

<style>

body {
    margin:0;
    font-family:Tahoma,Arial;
    background:#f1f5f9;
}

header {
    background:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
}

.container {
    max-width:800px;
    margin:30px auto;
    padding:15px;
}

.box {
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
}

input,select {
    width:100%;
    padding:12px;
    margin:6px 0 15px;
    box-sizing:border-box;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-family:Tahoma;
}

button {
    border:0;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    font-family:Tahoma;
}

.save {
    background:#2563eb;
    color:white;
}

.logout {
    background:#dc2626;
    color:white;
}

table {
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td {
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th {
    background:#f8fafc;
}

</style>

</head>

<body>

<header>

<h2>🕐 ثبت ساعت کاری</h2>

<div>

<button onclick="location.href='index.html'">
← داشبورد
</button>

<button
    class="logout"
    onclick="logout()"
>
خروج
</button>

</div>

</header>


<div class="container">


<div class="box">

<h2>ثبت ساعت</h2>


<label>
نام کارمند
</label>

<div id="employeeBox"></div>


<label>
تاریخ
</label>

<input
    type="text"
    id="workDate"
    placeholder="1405-05-06"
>


<label>
ساعت شروع
</label>

<input
    type="time"
    id="startTime"
>


<label>
ساعت پایان
</label>

<input
    type="time"
    id="endTime"
>


<label>
</label>

<input
    type="number"
    id="overtime"
    min="0"
    step="0.5"
    value="0"
>


<button
    class="save"
    onclick="saveWork()"
>
ثبت ساعت کاری
</button>


<p id="message"></p>

</div>


<div class="box">

<h2>ساعت‌های ثبت‌شده</h2>

<table>

<thead>

<tr>

<th>تاریخ</th>
<th>نام</th>
<th>شروع</th>
<th>پایان</th>
<th>ساعت کار</th>

</tr>

</thead>

<tbody id="table"></tbody>

</table>

</div>


</div>


<script>

let currentUser;


async function init() {

    const response =
        await fetch("/api/me");


    if(!response.ok) {

        location.href="/login.html";
        return;

    }


    currentUser =
        await response.json();


    const box =
        document.getElementById(
            "employeeBox"
        );


    if(currentUser.role === "employee") {

        box.innerHTML = `

            <input
                type="text"
                value="${escapeHtml(currentUser.employee.name)}"
                readonly
                style="background:#e2e8f0"
            >

        `;

    } else {

        const response =
            await fetch("/api/employees");


        const employees =
            await response.json();


        box.innerHTML = `

            <select id="employeeName">

                <option value="">
                    انتخاب کارمند
                </option>

                ${employees.map(e => `
                    <option value="${escapeHtml(e.name)}">
                        ${escapeHtml(e.name)}
                    </option>
                `).join("")}

            </select>

        `;

    }


    loadRecords();

}


async function saveWork() {

    let employeeName;


    if(currentUser.role === "employee") {

        employeeName =
            currentUser.employee.name;

    } else {

        employeeName =
            document
                .getElementById("employeeName")
                .value;

    }


    const workDate =
        document
            .getElementById("workDate")
            .value;


    const startTime =
        document
            .getElementById("startTime")
            .value;


    const endTime =
        document
            .getElementById("endTime")
            .value;


    const overtime =
        Number(
            document
                .getElementById("overtime")
                .value || 0
        );


    const message =
        document.getElementById("message");


    if(
        !employeeName ||
        !workDate ||
        !startTime ||
        !endTime
    ) {

        message.textContent =
            "اطلاعات کامل را وارد کنید.";

        return;

    }


    const response =
        await fetch(
            "/api/work-hours",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    employeeName,
                    workDate,
                    startTime,
                    endTime,
                    overtime
                })
            }
        );


    const result =
        await response.json();


    message.textContent =
        result.message;


    if(response.ok) {

        document
            .getElementById("workDate")
            .value = "";

        document
            .getElementById("startTime")
            .value = "";

        document
            .getElementById("endTime")
            .value = "";

        document
            .getElementById("overtime")
            .value = "0";

        loadRecords();

    }

}


async function loadRecords() {

    const response =
        await fetch(
            "/api/work-hours"
        );


    const records =
        await response.json();


    const table =
        document.getElementById("table");


    table.innerHTML = "";


    records.forEach(r => {

        table.innerHTML += `

            <tr>

                <td>${r.work_date}</td>

                <td>${escapeHtml(r.employee_name)}</td>

                <td>${r.start_time}</td>

                <td>${r.end_time}</td>

                <td>${r.work_hours}</td>

                <td>${r.overtime}</td>

            </tr>

        `;

    });

}


function escapeHtml(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


async function logout() {

    await fetch(
        "/api/logout",
        {method:"POST"}
    );

    location.href =
        "/login.html";

}


init();

</script>

</body>

</html>
