<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت ساعت کاری</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            font-family: Tahoma, Arial, sans-serif;
            cursor: pointer;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            color: white;
        }

        .back {
            background: #475569;
        }

        .logout {
            background: #dc2626;
        }

        .live-clock {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 12px 15px;
            font-size: 15px;
            letter-spacing: .3px;
        }

        .live-clock .time {
            font-weight: bold;
            font-size: 18px;
            margin-right: 8px;
        }

        .date-field {
            position: relative;
        }

        .date-input-wrap {
            display: flex;
            gap: 8px;
        }

        .date-input-wrap input {
            flex: 1;
        }

        .calendar-btn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 18px;
        }

        .jalali-calendar {
            display: none;
            position: absolute;
            z-index: 20;
            top: calc(100% + 6px);
            right: 0;
            width: 280px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,.15);
            padding: 12px;
        }

        .jalali-calendar.open {
            display: block;
        }

        .jalali-cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .jalali-cal-header button {
            background: #f1f5f9;
            border: none;
            border-radius: 6px;
            width: 30px;
            height: 30px;
            font-size: 15px;
        }

        .jalali-cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .jalali-cal-grid .day-name {
            font-size: 11px;
            color: #64748b;
            font-weight: bold;
            padding-bottom: 4px;
        }

        .jalali-cal-grid button {
            border: none;
            background: transparent;
            border-radius: 6px;
            padding: 7px 0;
            font-size: 13px;
        }

        .jalali-cal-grid button:hover {
            background: #e2e8f0;
        }

        .jalali-cal-grid button.today {
            border: 1px solid #2563eb;
        }

        .jalali-cal-grid button.selected {
            background: #2563eb;
            color: white;
        }

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;

            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .box h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-family: Tahoma, Arial, sans-serif;
            font-size: 14px;

            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .submit {
            margin-top: 25px;
            width: 100%;

            background: #2563eb;
            color: white;

            border: none;
            padding: 13px;

            border-radius: 8px;
            font-size: 15px;
        }

        .submit:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 18px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .loading {
            color: #64748b;
        }

        @media(max-width:650px) {

            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .container {
                padding: 10px;
                margin: 15px auto;
            }

            .box {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <h1>
        🕒 ثبت ساعت کاری
    </h1>


    <div class="buttons">

        <button
            class="btn back"
            onclick="location.href='index.html'"
        >
            ← داشبورد
        </button>


        <button
            class="btn logout"
            onclick="logout()"
        >
            🚪 خروج
        </button>

    </div>

</header>


<div class="live-clock" id="liveClock">
    <span class="time" id="liveTime">--:--:--</span>
    <span id="liveDate">در حال بارگذاری تاریخ...</span>
</div>



<div class="container">

    <div class="box">

        <h2>
            ثبت ساعت کارمند
        </h2>


        <form id="workForm">


            <div class="form-grid">


                <!-- کارمند -->

                <div class="full">

                    <label>
                        نام کارمند
                    </label>


                    <select
                        id="employeeName"
                        required
                    >

                        <option value="">
                            در حال دریافت کارکنان...
                        </option>

                    </select>

                </div>



                <!-- تاریخ -->

                <div class="date-field">

                    <label>
                        تاریخ
                    </label>


                    <div class="date-input-wrap">

                        <input
                            type="text"
                            id="workDate"
                            placeholder="1405-05-06"
                            pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}"
                            readonly
                            required
                            onclick="toggleCalendar()"
                        >

                        <button
                            type="button"
                            class="calendar-btn"
                            onclick="toggleCalendar()"
                        >
                            📅
                        </button>

                    </div>


                    <div
                        class="jalali-calendar"
                        id="jalaliCalendar"
                    >

                        <div class="jalali-cal-header">

                            <button
                                type="button"
                                onclick="changeCalMonth(-1)"
                            >
                                ▶
                            </button>

                            <span id="jalaliCalTitle"></span>

                            <button
                                type="button"
                                onclick="changeCalMonth(1)"
                            >
                                ◀
                            </button>

                        </div>

                        <div
                            class="jalali-cal-grid"
                            id="jalaliCalGrid"
                        >
                        </div>

                    </div>

                </div>



                <!-- ساعت شروع -->

                <div>

                    <label>
                        ساعت شروع
                    </label>


                    <input
                        type="time"
                        id="startTime"
                        required
                    >

                </div>



                <!-- ساعت پایان -->

                <div>

                    <label>
                        ساعت پایان
                    </label>


                    <input
                        type="time"
                        id="endTime"
                        required
                    >

                </div>


            </div>



            <button
                type="submit"
                class="submit"
            >
                💾 ثبت ساعت کاری
            </button>


            <p id="message"></p>


        </form>

    </div>

</div>



<script>


// =====================================================
// تبدیل تاریخ میلادی و شمسی (الگوریتم استاندارد جلالی)
// =====================================================

function jalDiv(a, b) { return ~~(a / b); }
function jalMod(a, b) { return a - ~~(a / b) * b; }

function jalCal(jy) {

    const breaks = [
        -61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181,
        1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178
    ];

    const gy = jy + 621;

    let leapJ = -14, jp = breaks[0], jm, jump = 0, n, i;

    for (i = 1; i < breaks.length; i += 1) {

        jm = breaks[i];
        jump = jm - jp;

        if (jy < jm) break;

        leapJ = leapJ + jalDiv(jump, 33) * 8 + jalDiv(jalMod(jump, 33), 4);
        jp = jm;
    }

    n = jy - jp;

    leapJ = leapJ + jalDiv(n, 33) * 8 + jalDiv(jalMod(n, 33) + 3, 4);

    if (jalMod(jump, 33) === 4 && jump - n === 4) leapJ += 1;

    const leapG = jalDiv(gy, 4) - jalDiv((jalDiv(gy, 100) + 1) * 3, 4) - 150;

    const march = 20 + leapJ - leapG;

    if (jump - n < 6) n = n - jump + jalDiv(jump, 33) * 33;

    let leap = jalMod(jalMod(n + 1, 33) - 1, 4);

    if (leap === -1) leap = 4;

    return { leap: leap, gy: gy, march: march };
}

function g2d(gy, gm, gd) {

    let d = jalDiv((gy + jalDiv(gm - 8, 6) + 100100) * 1461, 4)
        + jalDiv(153 * jalMod(gm + 9, 12) + 2, 5)
        + gd - 34840408;

    d = d - jalDiv(jalDiv(gy + 100100 + jalDiv(gm - 8, 6), 100) * 3, 4) + 752;

    return d;
}

function d2g(jdn) {

    let j = 4 * jdn + 139361631;

    j = j + jalDiv(jalDiv(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;

    const i = jalDiv(jalMod(j, 1461), 4) * 5 + 308;

    const gd = jalDiv(jalMod(i, 153), 5) + 1;
    const gm = jalMod(jalDiv(i, 153), 12) + 1;
    const gy = jalDiv(j, 1461) - 100100 + jalDiv(8 - gm, 6);

    return { gy: gy, gm: gm, gd: gd };
}

function j2d(jy, jm, jd) {

    const r = jalCal(jy);

    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - jalDiv(jm, 7) * (jm - 7) + jd - 1;
}

function toJalali(gy, gm, gd) {

    const jdn = g2d(gy, gm, gd);
    const gy2 = d2g(jdn).gy;

    let jy = gy2 - 621;

    const r = jalCal(jy);
    const jdn1f = g2d(r.gy, 3, r.march);

    let k = jdn - jdn1f;
    let jm, jd;

    if (k >= 0) {

        if (k <= 185) {

            jm = 1 + jalDiv(k, 31);
            jd = jalMod(k, 31) + 1;

            return { jy: jy, jm: jm, jd: jd };
        }

        k -= 186;

    } else {

        jy -= 1;
        k += 179;

        if (r.leap === 1) k += 1;
    }

    jm = 7 + jalDiv(k, 30);
    jd = jalMod(k, 30) + 1;

    return { jy: jy, jm: jm, jd: jd };
}

function toGregorian(jy, jm, jd) {

    return d2g(j2d(jy, jm, jd));
}

function isLeapJalaliYear(jy) {

    return jalCal(jy).leap === 0;
}

function jalaliMonthLength(jy, jm) {

    if (jm <= 6) return 31;
    if (jm <= 11) return 30;

    return isLeapJalaliYear(jy) ? 30 : 29;
}

function pad2(number) {

    return String(number).padStart(2, "0");
}


// =====================================================
// نوار تاریخ و ساعت زنده
// =====================================================

const jalaliMonthNames = [
    "فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
    "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"
];

const jalaliWeekDayNames = [
    "شنبه", "یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه"
];

function updateLiveClock() {

    const now = new Date();

    const j = toJalali(
        now.getFullYear(),
        now.getMonth() + 1,
        now.getDate()
    );

    const weekDayIndex = (now.getDay() + 1) % 7;

    document.getElementById("liveTime").textContent =
        `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;

    document.getElementById("liveDate").textContent =
        `${jalaliWeekDayNames[weekDayIndex]} ${j.jd} ${jalaliMonthNames[j.jm - 1]} ${j.jy}`;
}

updateLiveClock();
setInterval(updateLiveClock, 1000);


// =====================================================
// تقویم شمسی برای انتخاب تاریخ
// =====================================================

let calState = null;


function toggleCalendar() {

    const calendar =
        document.getElementById("jalaliCalendar");

    if (calendar.classList.contains("open")) {

        calendar.classList.remove("open");
        return;
    }


    const today = new Date();

    const todayJalali =
        toJalali(
            today.getFullYear(),
            today.getMonth() + 1,
            today.getDate()
        );


    if (!calState) {

        calState = {
            jy: todayJalali.jy,
            jm: todayJalali.jm
        };
    }


    renderCalendar();

    calendar.classList.add("open");
}


function changeCalMonth(step) {

    calState.jm += step;

    if (calState.jm > 12) {
        calState.jm = 1;
        calState.jy += 1;
    }

    if (calState.jm < 1) {
        calState.jm = 12;
        calState.jy -= 1;
    }

    renderCalendar();
}


function renderCalendar() {

    document.getElementById("jalaliCalTitle").textContent =
        `${jalaliMonthNames[calState.jm - 1]} ${calState.jy}`;


    const today = new Date();

    const todayJalali =
        toJalali(
            today.getFullYear(),
            today.getMonth() + 1,
            today.getDate()
        );


    const selectedValue =
        document.getElementById("workDate").value.trim();


    const firstDayGregorian =
        toGregorian(calState.jy, calState.jm, 1);

    const firstDayDate = new Date(
        firstDayGregorian.gy,
        firstDayGregorian.gm - 1,
        firstDayGregorian.gd
    );

    const startOffset = (firstDayDate.getDay() + 1) % 7;

    const daysInMonth =
        jalaliMonthLength(calState.jy, calState.jm);


    const grid =
        document.getElementById("jalaliCalGrid");

    grid.innerHTML = "";


    jalaliWeekDayNames.forEach(name => {

        const cell = document.createElement("div");

        cell.className = "day-name";
        cell.textContent = name[0];

        grid.appendChild(cell);
    });


    for (let i = 0; i < startOffset; i += 1) {

        grid.appendChild(document.createElement("div"));
    }


    for (let day = 1; day <= daysInMonth; day += 1) {

        const button = document.createElement("button");

        button.type = "button";
        button.textContent = day;

        const dateStr =
            `${calState.jy}-${pad2(calState.jm)}-${pad2(day)}`;


        if (
            calState.jy === todayJalali.jy &&
            calState.jm === todayJalali.jm &&
            day === todayJalali.jd
        ) {

            button.classList.add("today");
        }


        if (dateStr === selectedValue) {

            button.classList.add("selected");
        }


        button.onclick = function () {

            document.getElementById("workDate").value = dateStr;

            document
                .getElementById("jalaliCalendar")
                .classList.remove("open");
        };


        grid.appendChild(button);
    }
}


document.addEventListener("click", function (event) {

    const field =
        document.querySelector(".date-field");

    if (field && !field.contains(event.target)) {

        document
            .getElementById("jalaliCalendar")
            .classList.remove("open");
    }
});





// =====================================================
// دریافت کارکنان
// =====================================================

async function loadEmployees() {

    const select =
        document.getElementById(
            "employeeName"
        );


    try {


        const response =
            await fetch(
                "/api/employees",
                {
                    credentials:
                        "same-origin"
                }
            );


        if (response.status === 401) {

            location.href =
                "/login.html";

            return;
        }


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت کارکنان"
            );

        }


        const employees =
            await response.json();


        select.innerHTML = `

            <option value="">
                انتخاب کارمند
            </option>

        `;


        if (
            !Array.isArray(employees) ||
            employees.length === 0
        ) {

            select.innerHTML = `

                <option value="">
                    هنوز کارمندی ثبت نشده است
                </option>

            `;

            return;
        }


        employees.forEach(
            employee => {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    employee.name;


                if (
                    employee.personnel_number
                ) {

                    option.textContent =
                        `${employee.name} - ${employee.personnel_number}`;

                } else {

                    option.textContent =
                        employee.name;

                }


                select.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        console.error(error);


        select.innerHTML = `

            <option value="">
                خطا در دریافت کارکنان
            </option>

        `;

    }

}



// =====================================================
// ثبت ساعت کاری
// =====================================================

document
    .getElementById("workForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const employeeName =
                document.getElementById(
                    "employeeName"
                ).value;


            const workDate =
                document.getElementById(
                    "workDate"
                ).value.trim();


            const startTime =
                document.getElementById(
                    "startTime"
                ).value;


            const endTime =
                document.getElementById(
                    "endTime"
                ).value;


            const message =
                document.getElementById(
                    "message"
                );


            if (
                !employeeName ||
                !workDate ||
                !startTime ||
                !endTime
            ) {

                message.textContent =
                    "لطفاً تمام اطلاعات ضروری را وارد کنید.";

                message.className =
                    "error";

                return;
            }


            if (
                !/^\d{4}-\d{2}-\d{2}$/
                    .test(workDate)
            ) {

                message.textContent =
                    "فرمت تاریخ باید مانند 1405-05-06 باشد.";

                message.className =
                    "error";

                return;
            }


            try {


                const response =
                    await fetch(
                        "/api/work-hours",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "same-origin",

                            body:
                                JSON.stringify({

                                    employeeName,

                                    workDate,

                                    startTime,

                                    endTime

                                })
                        }
                    );


                if (response.status === 401) {

                    location.href =
                        "/login.html";

                    return;
                }


                const result =
                    await response.json();


                message.textContent =
                    result.message ||
                    "ساعت کاری ثبت شد.";


                if (response.ok) {

                    message.className =
                        "success";


                    document
                        .getElementById(
                            "workForm"
                        )
                        .reset();

                } else {

                    message.className =
                        "error";

                }


            } catch (error) {

                console.error(error);


                message.textContent =
                    "خطا در ارتباط با سرور.";


                message.className =
                    "error";

            }

        }
    );



// =====================================================
// خروج
// =====================================================

async function logout() {

    try {

        await fetch(
            "/api/logout",
            {
                method: "POST",
                credentials: "same-origin"
            }
        );

    } catch (error) {

        console.error(error);

    }


    location.href =
        "/login.html";

}



// =====================================================
// شروع صفحه
// =====================================================

loadEmployees();

</script>


</body>

</html>
